name: Daily Price Alert

on:
  schedule:
    # 06:30 AM UTC = 12:00 PM IST
    - cron: '30 6 * * *'
  workflow_dispatch: # This button lets you test it manually

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Execute Python Script
        env:
          # Linking GitHub Secrets to Python Environment Variables
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
        run: python amazon_scraper.py
